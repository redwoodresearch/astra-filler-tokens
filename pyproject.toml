[project]
name = "neuralese-filler"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "antlr4-python3-runtime==4.11.*",
    "datasets>=5.0.1",
    "matplotlib>=3.11.1",
    "openai>=3.8.0",
    "pandas>=3.0.5",
    "pypdf>=6.18.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
    "tiktoken>=0.14.0",
    "unidecode>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nf"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
